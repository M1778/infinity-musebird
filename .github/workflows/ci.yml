name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[all]"
          uv pip install pytest pytest-asyncio ruff pyright
      - name: Ruff
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Build wheel
        run: uv build --wheel .
      - name: Tests
        run: uv run pytest -q
      - name: Wheel contains every subpackage
        run: uv run pytest -q tests/test_packaging.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv
          uv pip install -e .
      - name: Scan repository for secrets
        run: uv run python scripts/scan_repo.py

  installer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv
          uv pip install -e .
      - name: Install into fixture homes for every harness
        run: |
          set -euo pipefail
          MB="$PWD/.venv/bin/musebird"
          export HOME=$(mktemp -d)
          export XDG_CONFIG_HOME="$HOME/.config"
          export MUSEBIRD_HOME="$HOME/.infinity-musebird"
          mkdir -p "$HOME/.claude" "$HOME/.codex" "$XDG_CONFIG_HOME/opencode"
          echo '{"theme":"dark"}' > "$HOME/.claude.json"
          printf '[model]\nname = "x"\n' > "$HOME/.codex/config.toml"
          echo '{"theme":"dark"}' > "$XDG_CONFIG_HOME/opencode/opencode.json"
          "$MB" install --yes --skip-login
          "$MB" install --yes --skip-login
          echo "--- claude ---"; cat "$HOME/.claude.json"
          echo "--- codex ---"; cat "$HOME/.codex/config.toml"
          echo "--- opencode ---"; cat "$XDG_CONFIG_HOME/opencode/opencode.json"
          test "$(grep -c musebird "$HOME/.claude.json")" -eq 2
          test -f "$HOME/.claude/skills/inf-muse/SKILL.md"
          test -f "$HOME/.agents/skills/inf-muse/SKILL.md"
          test -f "$XDG_CONFIG_HOME/opencode/skills/inf-muse/SKILL.md"
          # dry run must not write
          before=$(cat "$HOME/.claude.json")
          "$MB" uninstall --dry-run
          test "$before" = "$(cat "$HOME/.claude.json")"
          "$MB" uninstall
          ! grep -q '"musebird"' "$HOME/.claude.json"
          echo "installer smoke: ok"
